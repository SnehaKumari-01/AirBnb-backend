services:
  - type: web
    name: airbnb-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: airbnb-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: airbnb-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: airbnb-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: airbnb-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: airbnb-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:8080
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: airbnb-db
    databaseName: airbnb
    user: postgres
    plan: free
